{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">NEW REQUEST</p><h1>Create support ticket</h1><p class="muted">Capture the issue so it can be investigated and tracked.</p></div></div><section class="panel formpanel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Issue title<input name="title" maxlength="120" required placeholder="e.g. Unable to access internal portal"></label><label>Issue description<textarea name="description" rows="5" required placeholder="Describe the issue and any error messages..."></textarea></label><div class="twofields"><label>Requester<input name="requester" maxlength="100" required placeholder="Name"></label><label>Category<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label></div><label>Priority<select name="priority">{% for p in priorities %}<option {% if p=='Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><div class="actions"><button class="btn">Create ticket</button><a class="secondary" href="{{ url_for('tickets') }}">Cancel</a></div></form></section>{% endblock %}
